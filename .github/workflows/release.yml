name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  GOCACHE: /tmp/taskforge-gocache

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        env:
          TASKFORGE_VERSION: ${{ github.ref_name }}
          TASKFORGE_COMMIT: ${{ github.sha }}
          TASKFORGE_PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
        run: ./scripts/build-release.sh

      - name: Verify release metadata and checksums
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          test -s dist/taskforge-binaries.spdx.json
          test -s dist/provenance.json

      - name: Attest release binaries and metadata
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*

      - name: Set image repository
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push scheduler image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f deploy/docker/scheduler.Dockerfile \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            -t "ghcr.io/${IMAGE_REPO}/scheduler:${GITHUB_REF_NAME}" \
            --sbom=true \
            --provenance=mode=max \
            --push .

      - name: Build and push API image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f deploy/docker/api.Dockerfile \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            -t "ghcr.io/${IMAGE_REPO}/api:${GITHUB_REF_NAME}" \
            --sbom=true \
            --provenance=mode=max \
            --push .

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
