name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  GOCACHE: /tmp/taskforge-gocache

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binaries
        env:
          TASKFORGE_VERSION: ${{ github.ref_name }}
          TASKFORGE_COMMIT: ${{ github.sha }}
          TASKFORGE_PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
        run: ./scripts/build-release.sh

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes

      - name: Set image repository
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push worker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f deploy/docker/worker.Dockerfile \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            -t "ghcr.io/${IMAGE_REPO}/worker:${GITHUB_REF_NAME}" \
            --push .

      - name: Build and push scheduler image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f deploy/docker/scheduler.Dockerfile \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            -t "ghcr.io/${IMAGE_REPO}/scheduler:${GITHUB_REF_NAME}" \
            --push .

      - name: Build and push API image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f deploy/docker/api.Dockerfile \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            -t "ghcr.io/${IMAGE_REPO}/api:${GITHUB_REF_NAME}" \
            --push .
