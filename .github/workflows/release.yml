name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  GOCACHE: /tmp/taskforge-gocache
  STATICCHECK_VERSION: "v0.8.1"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            research/go.sum

      - name: Download modules
        run: go mod download

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}

      - name: Test
        run: make test

      - name: Lint
        env:
          TASKFORGE_REQUIRE_STATICCHECK: "1"
        run: make lint

      - name: Static security-adjacent checks
        run: make security-check

      - name: Race tests
        run: make race-test

      - name: Reachable dependency vulnerability scan
        run: make vuln-check

      - name: Validate release artifacts without publishing
        run: make release-validate

  release:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            research/go.sum

      - name: Build release binaries
        env:
          TASKFORGE_VERSION: ${{ github.ref_name }}
          TASKFORGE_COMMIT: ${{ github.sha }}
          TASKFORGE_PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
        run: ./scripts/build-release.sh

      - name: Verify release metadata and checksums
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          test -s dist/taskforge-binaries.spdx.json
          test -s dist/provenance.json

      - name: Generate attachable reliability certification
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            go run ./cmd/certify \
              -json dist/reliability-certification.json \
              -markdown dist/reliability-certification.md \
              -commit "${GITHUB_SHA}" \
              -source-date-epoch "$(git show -s --format=%ct HEAD)" \
              -result artifact=passed:release-artifacts-validated \
              -artifact dist/SHA256SUMS \
              -artifact dist/provenance.json \
              -artifact dist/taskforge-binaries.spdx.json \
              -allow-incomplete

      - name: Attest release binaries and metadata
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Set image repository
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push scheduler image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f deploy/docker/scheduler.Dockerfile \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            -t "ghcr.io/${IMAGE_REPO}/scheduler:${GITHUB_REF_NAME}" \
            --sbom=generator=mirror.gcr.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68 \
            --provenance=mode=max \
            --push .

      - name: Build and push API image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f deploy/docker/api.Dockerfile \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            -t "ghcr.io/${IMAGE_REPO}/api:${GITHUB_REF_NAME}" \
            --sbom=generator=mirror.gcr.io/docker/buildkit-syft-scanner@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68 \
            --provenance=mode=max \
            --push .

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
