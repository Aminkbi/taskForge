global:
  scrape_interval: 5s

scrape_configs:
  - job_name: taskforge-scheduler
    basic_auth:
      username: taskforge
      password: taskforge-compose-development-only-0000000000000000
    static_configs:
      - targets: ["scheduler:8080"]

  - job_name: taskforge-api
    basic_auth:
      username: taskforge
      password: taskforge-compose-development-only-0000000000000000
    static_configs:
      - targets: ["api:8080"]
